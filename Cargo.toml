[package]
name = "concord"
version = "0.1.6"
edition = "2024"
description = "Rust coordinate transformation library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]

[dependencies]
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.6.2" }
graphix = { git = "https://github.com/robolibs/graphix", tag = "v0.1.6" }
kiddo = "4.2"
nalgebra = "0.33"
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
rayon = "1.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }

[[example]]
name = "builder_chain"
path = "examples/rust/builder_chain.rs"

[[example]]
name = "timed_transform_lookup"
path = "examples/rust/timed_transform_lookup.rs"

[[example]]
name = "transform_tree_lookup"
path = "examples/rust/transform_tree_lookup.rs"

[[example]]
name = "wgs_to_enu"
path = "examples/rust/wgs_to_enu.rs"
