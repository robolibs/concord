[package]
name = "concord"
version = "0.0.1"
edition = "2024"
description = "Rust coordinate transformation library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[dependencies]
datapod = { git = "https://codeberg.org/robolibs/datapod.git", rev = "4547e328826fb4fd788b7acac29c2f70efc62746" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", rev = "63b38d1b71b621cddf6d6a3070d9646bea83e7c4" }
kiddo = "4.2"
nalgebra = "0.33"
pyo3 = { version = "0.23", optional = true }
rayon = "1.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }
